name: morpheus-graphql-server
version: 0.28.4
github: nalchevanidze/morpheus-graphql
license: MIT
author: Daviti Nalchevanidze
category: web, graphql
synopsis: Morpheus GraphQL
maintainer: d.nalchevanidze@gmail.com
homepage: https://morpheusgraphql.com
copyright: (c) 2019 Daviti Nalchevanidze
license-file: LICENSE
description: Build GraphQL APIs with your favourite functional language!
extra-source-files:
- README.md
- changelog.md
data-files:
- test/**/*.gql
- test/**/*.json
dependencies:
- aeson                  >=  1.4.4     &&  <  3.0.0
- base                   >=  4.7.0     &&  <  5.0.0
- bytestring             >=  0.10.4    &&  <  1.0.0
- containers             >=  0.4.2.1   &&  <  1.0.0
- morpheus-graphql-app   >=  0.28.0    &&  <  0.29.0
- morpheus-graphql-core  >=  0.28.0    &&  <  0.29.0
- mtl                    >=  2.0.0     &&  <  3.0.0
- relude                 >=  0.3.0     &&  <  2.0.0
- template-haskell       >=  2.0.0     &&  <  3.0.0
- text                   >=  1.2.3     &&  <  3.0.0
- transformers           >=  0.3.0     &&  <  1.0.0
- unordered-containers   >=  0.2.8     &&  <  1.0.0
- vector                 >=  0.12.0.1  &&  <  1.0.0
library:
  source-dirs: src
  ghc-options: -Wall
  exposed-modules:
  - Data.Morpheus.Server
  - Data.Morpheus.Server.CodeGen.Internal
  - Data.Morpheus.Server.Resolvers
  - Data.Morpheus.Server.Types
  - Data.Morpheus.Generic
  - Data.Morpheus.Generic.Cons
  - Data.Morpheus.Generic.Fields
  - Data.Morpheus.Generic.Gmap
  - Data.Morpheus.Generic.GRep
  - Data.Morpheus.Generic.GScan
  - Data.Morpheus.Generic.Proxy
  - Data.Morpheus.Generic.RefType
  - Data.Morpheus.Server.Deriving.App
  - Data.Morpheus.Server.Deriving.Internal.Directive
  - Data.Morpheus.Server.Deriving.Internal.Resolver
  - Data.Morpheus.Server.Deriving.Internal.Type
  - Data.Morpheus.Server.Deriving.Internal.Value
  - Data.Morpheus.Server.Deriving.Kinded.Arguments
  - Data.Morpheus.Server.Deriving.Kinded.Channels
  - Data.Morpheus.Server.Deriving.Kinded.NamedResolver
  - Data.Morpheus.Server.Deriving.Kinded.NamedResolverFun
  - Data.Morpheus.Server.Deriving.Kinded.Resolver
  - Data.Morpheus.Server.Deriving.Kinded.Type
  - Data.Morpheus.Server.Deriving.Kinded.Value
  - Data.Morpheus.Server.Deriving.Resolvers
  - Data.Morpheus.Server.Deriving.Schema
  - Data.Morpheus.Server.Deriving.Utils.GScan
  - Data.Morpheus.Server.Deriving.Utils.Kinded
  - Data.Morpheus.Server.Deriving.Utils.Types
  - Data.Morpheus.Server.Deriving.Utils.Use
  - Data.Morpheus.Server.Playground
  - Data.Morpheus.Server.Types.DirectiveDefinitions
  - Data.Morpheus.Server.Types.Directives
  - Data.Morpheus.Server.Types.GQLType
  - Data.Morpheus.Server.Types.Internal
  - Data.Morpheus.Server.Types.Kind
  - Data.Morpheus.Server.Types.NamedResolvers
  - Data.Morpheus.Server.Types.TypeName
  - Data.Morpheus.Server.Types.Types
  - Data.Morpheus.Server.Types.Visitors
tests:
  morpheus-graphql-server-test:
    main: Spec.hs
    source-dirs: test
    ghc-options: -Wall
    dependencies:
    - aeson                           >=  1.4.4   &&  <  3.0.0
    - file-embed                      >=  0.0.10  &&  <  1.0.0
    - morpheus-graphql-server         >=  0.28.0  &&  <  0.29.0
    - morpheus-graphql-subscriptions  >=  0.28.0  &&  <  0.29.0
    - morpheus-graphql-tests          >=  0.28.0  &&  <  0.29.0
    - tasty                           >=  0.1.0   &&  <  2.0.0
    - tasty-hunit                     >=  0.1.0   &&  <  1.0.0
